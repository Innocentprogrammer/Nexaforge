# NexaInvite production stack.
#
#   cp .env.production.example .env.production   # then fill in every value
#   docker compose --env-file .env.production up -d --build
#
# Only nginx publishes a port. Postgres and Redis sit on the `data` network,
# which has no route out, and publish nothing. Migrations and seed data run once
# per deploy in the `migrate` service, before the app starts.
# For local development, run Django and Next.js directly (see README.md).

x-backend-env: &backend-env
  DJANGO_ENV: production
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.production}
  ALLOWED_HOSTS: ${API_DOMAIN:?set API_DOMAIN}
  CORS_ALLOWED_ORIGINS: ${APP_URL:?set APP_URL}
  CSRF_TRUSTED_ORIGINS: ${APP_URL},${API_URL:?set API_URL}
  FRONTEND_URL: ${APP_URL}
  NUM_PROXIES: ${NUM_PROXIES:-1}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
  DB_ENGINE: postgres
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-nexainvite}
  DB_USER: ${POSTGRES_USER:-nexainvite}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  CACHE_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/1
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_TASK_ALWAYS_EAGER: "False"
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-NexaInvite <no-reply@nexainvite.com>}
  ADMINS: ${ADMINS:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  INVITE_SEND_BACKEND: ${INVITE_SEND_BACKEND:-console}
  NEXAINVITE_TWILIO_ACCOUNT_SID: ${NEXAINVITE_TWILIO_ACCOUNT_SID:-}
  NEXAINVITE_TWILIO_AUTH_TOKEN: ${NEXAINVITE_TWILIO_AUTH_TOKEN:-}
  NEXAINVITE_TWILIO_WHATSAPP_FROM: ${NEXAINVITE_TWILIO_WHATSAPP_FROM:-}
  NEXAINVITE_TWILIO_SMS_FROM: ${NEXAINVITE_TWILIO_SMS_FROM:-}
  NEXAINVITE_TWILIO_TEMPLATE_SID: ${NEXAINVITE_TWILIO_TEMPLATE_SID:-}

x-backend: &backend
  build: ./backend
  image: nexainvite-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment: *backend-env
  # data: Postgres/Redis. app: nginx, plus outbound SMTP, Razorpay, Twilio.
  networks: [data, app]
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexainvite}
      POSTGRES_USER: ${POSTGRES_USER:-nexainvite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password passed through the environment so it never shows in `ps`.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off: apply migrations and load seed data, then exit. The app services
  # wait for it to finish successfully (AUD-16).
  migrate:
    <<: *backend
    restart: "no"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_catalog &&
             python manage.py seed_subscription_plans"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker:
    <<: *backend
    command: celery -A config worker -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    <<: *backend
    # Schedule state in /tmp: the image's /app is read-only to the app user.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes: []
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_URL:?set API_URL}/api/v1
    image: nexainvite-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [app]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      # Only substitute our own variables; leave nginx's $host etc. alone.
      NGINX_ENVSUBST_FILTER: "^(APP|API)_DOMAIN$$"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - media:/srv/media:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  # No route out: only the backend services can reach Postgres and Redis.
  data:
    internal: true
  # nginx, frontend and backend; has normal outbound access.
  app: {}

volumes:
  pgdata:
  redisdata:
  media:
