services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexainvite
      POSTGRES_USER: nexainvite
      POSTGRES_PASSWORD: nexainvite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_templates &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: nexainvite
      DB_USER: nexainvite
      DB_PASSWORD: nexainvite
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
